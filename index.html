<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICH FARM</title>
    <style>
        :root {
            --bg: #070709;
            --card: #121218;
            --primary: #2979ff;
            --gold: #ffd700;
            --text: #ffffff;
            --muted: #9e9eb0;
            --border: #2a2a3b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        header { background: #1a1a24; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); }
        .balance { color: var(--gold); font-weight: bold; font-size: 18px; }
        
        .container { padding: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; margin-bottom: 16px; text-align: center; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; background: var(--primary); color: white; }
        .btn:active { transform: scale(0.97); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .slot { background: #1a1a24; border: 1px dashed var(--border); border-radius: 12px; padding: 15px; text-align: center; font-size: 13px; }
        
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #0f0f13; border-top: 1px solid var(--border); }
        .nav-btn { flex: 1; padding: 15px; background: none; border: none; color: var(--muted); cursor: pointer; font-weight: bold; }
        .nav-btn.active { color: var(--primary); }
        
        .tab { display: none; }
        .tab.active { display: block; }
    </style>
</head>
<body>

    <header>
        <div>Ферма RICH</div>
        <div class="balance">💰 <span id="balance">0</span> RICH</div>
    </header>

    <div class="container">
        <!-- ВКЛАДКА ФЕРМЫ -->
        <div id="tab-farm" class="tab active">
            <div class="card">
                <h3>🏭 Производство</h3>
                <p style="color: var(--muted); font-size: 13px; margin: 10px 0;">Доход: <span id="income" style="color: var(--gold);">1</span> RICH / сек</p>
                <div class="grid" id="slotsGrid"></div>
                <button class="btn" onclick="buyBuilding()">Купить цех (Цена: <span id="nextPrice">100</span> RICH)</button>
            </div>
        </div>

        <!-- ВКЛАДКА ПРОФИЛЯ / АДМИНКИ -->
        <div id="tab-profile" class="tab">
            <div class="card">
                <h3>👤 Профиль игрока</h3>
                <p style="color: var(--muted); margin: 10px 0;">ID: <span id="myId">8684827145</span></p>
                <div id="adminPanel" style="border: 2px dashed var(--gold); padding: 15px; border-radius: 10px; margin-top: 15px; display: none;">
                    <h4 style="color: var(--gold); margin-bottom: 8px;">👑 Админ-панель</h4>
                    <input type="number" id="admSum" placeholder="Сумма RICH" style="width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 8px;">
                    <button class="btn" style="background: #ff1744; margin-top: 0;" onclick="adminAddMoney()">Начислить</button>
                </div>
            </div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('farm', this)">Ферма</button>
        <button class="nav-btn" onclick="switchTab('profile', this)">Профиль</button>
    </div>

    <script>
        const ADMIN_ID = 8684827145;
        let game = JSON.parse(localStorage.getItem('rich_farm_save')) || {
            balance: 50,
            buildings: 1,
            income: 1,
            nextPrice: 100
        };

        // Инициализация интерфейса
        document.getElementById('myId').innerText = ADMIN_ID;
        if(ADMIN_ID === 8684827145) {
            document.getElementById('adminPanel').style.display = 'block';
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(game.balance);
            document.getElementById('income').innerText = game.income;
            document.getElementById('nextPrice').innerText = game.nextPrice;

            let grid = document.getElementById('slotsGrid');
            grid.innerHTML = '';
            for(let i = 0; i < 4; i++) {
                if(i < game.buildings) {
                    grid.innerHTML += `<div class="slot" style="border-style: solid; border-color: var(--primary);">🏢 Цех #${i+1}<br><span style="color:var(--gold); font-size:11px;">Активен</span></div>`;
                } else {
                    grid.innerHTML += `<div class="slot">🔒 Заблокировано</div>`;
                }
            }
        }

        // Пассивный доход каждую секунду
        setInterval(() => {
            game.balance += game.income / 10;
            updateUI();
            localStorage.setItem('rich_farm_save', JSON.stringify(game));
        }, 100);

        function buyBuilding() {
            if(game.balance < game.nextPrice) {
                alert('Недостаточно RICH!');
                return;
            }
            game.balance -= game.nextPrice;
            game.buildings++;
            game.income += 2;
            game.nextPrice = Math.floor(game.nextPrice * 1.7);
            updateUI();
            localStorage.setItem('rich_farm_save', JSON.stringify(game));
        }

        function adminAddMoney() {
            let sum = parseInt(document.getElementById('admSum').value);
            if(isNaN(sum)) return;
            game.balance += sum;
            updateUI();
            localStorage.setItem('rich_farm_save', JSON.stringify(game));
            alert('Успешно начислено!');
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            el.classList.add('active');
        }

        updateUI();
    </script>
</body>
</html>
