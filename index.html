            height: 60vh;
            flex-direction: column;
        }
        .coin {

            height: 180px;
            background: radial-gradient(circle at 30% 30%, #f5a623, #d4891b);
            border-radius: 50%;

            justify-content: center;
            align-items: center;
            font-size: 60px;
            cursor: pointer;
            user-select: none;

        }
        .coin:active { transform: scale(0.9); }
        .coin-text { margin-top: 20px; color: #aaa; }
