<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICH GAME: CLAN BATTLES</title>
    <style>
        :root { --gold: #ffd700; --bg: #0f0f13; --card: #1a1a24; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        .header { background: #16161f; padding: 15px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--gold); }
        .content { padding: 15px; padding-bottom: 100px; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; }
        .btn { background: linear-gradient(to right, #ff9800, #f44336); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .navbar { position: fixed; bottom: 0; width: 100%; display: flex; background: #16161f; padding: 15px 0; justify-content: space-around; border-top: 1px solid #333; }
        .nav-item { cursor: pointer; color: #888; font-size: 12px; }
        .nav-item.active { color: var(--gold); }
        .progress-bar { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: var(--gold); transition: width 0.5s; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header">
    <div>RICH GAME</div>
    <div>💰 <span id="balance">100</span> RICH</div>
</div>

<div class="content">
    <!-- БОЙ -->
    <div id="tab1" class="tab-content">
        <div class="card">
            <h2 id="bossName">💀 Скелет</h2>
            <div id="bossIcon" style="font-size: 60px;">💀</div>
            <div class="progress-bar"><div class="progress-fill" id="hpBar" style="width: 100%;"></div></div>
            <p>ХП: <span id="bossHp">1600</span> / <span id="bossMax">1600</span></p>
            <p>⏳ До сброса: <span id="timer">24:00:00</span></p>
            <button class="btn" onclick="attack()">⚔ АТАКОВАТЬ (-3ч кулдаун)</button>
        </div>
    </div>

    <!-- КЛАНЫ -->
    <div id="tab2" class="tab-content hidden">
        <div class="card">
            <h3>🏰 Кланы</h3>
            <p>Участники: <span id="members">1</span>/25</p>
            <button class="btn" onclick="createClan()">Создать клан (2500 RICH)</button>
        </div>
    </div>

    <!-- МАГАЗИН -->
    <div id="tab3" class="tab-content hidden">
        <h3>🛒 Магазин</h3>
        <div id="shopList"></div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="tab4" class="tab-content hidden">
        <div class="card">
            <h3>👤 Профиль</h3>
            <p>Сила героя: <span id="power">10</span></p>
            <button class="btn" onclick="topUp()">Пополнить (TON)</button>
        </div>
    </div>
</div>

<div class="navbar">
    <div class="nav-item active" onclick="showTab(1)">⚔ Бой</div>
    <div class="nav-item" onclick="showTab(2)">🏰 Клан</div>
    <div class="nav-item" onclick="showTab(3)">🛒 Магазин</div>
    <div class="nav-item" onclick="showTab(4)">👤 Профиль</div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('game')) || {
        balance: 100, power: 10, bossHp: 1600, bossLevel: 0, lastAttack: 0, members: 1
    };

    const bosses = [
        {n: "Скелет", i: "💀", h: 1600, r: 800}, {n: "Ведьма", i: "🧙", h: 2000, r: 1000},
        {n: "Вампир", i: "🦇", h: 2400, r: 1300}, {n: "Дракон", i: "🐉", h: 3000, r: 1600},
        {n: "Демон", i: "👹", h: 4000, r: 2500}, {n: "Кибер-Титан", i: "🦾", h: 7000, r: 4000},
        {n: "Повелитель Бездны", i: "👑", h: 10000, r: 7000}
    ];

    function update() {
        let b = bosses[state.bossLevel];
        document.getElementById('balance').innerText = state.balance;
        document.getElementById('bossName').innerText = b.n;
        document.getElementById('bossIcon').innerText = b.i;
        document.getElementById('bossHp').innerText = state.bossHp;
        document.getElementById('bossMax').innerText = b.h;
        document.getElementById('hpBar').style.width = (state.bossHp/b.h*100) + "%";
        document.getElementById('power').innerText = state.power;
        localStorage.setItem('game', JSON.stringify(state));
    }

    function attack() {
        if(Date.now() - state.lastAttack < 3 * 3600 * 1000) return alert("Перезарядка 3 часа!");
        state.bossHp -= (state.power * 2);
        state.lastAttack = Date.now();
        if(state.bossHp <= 0) {
            state.balance += bosses[state.bossLevel].r;
            state.bossLevel = (state.bossLevel + 1) % bosses.length;
            state.bossHp = bosses[state.bossLevel].h;
        }
        update();
    }

    function createClan() {
        if(state.balance < 2500) return alert("Нужно 2500 RICH!");
        state.balance -= 2500;
        alert("Клан создан!");
        update();
    }

    function showTab(n) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById('tab'+n).classList.remove('hidden');
    }

    function topUp() { window.open("ton://transfer/UQDmNY1TIMIgnALOpAyJ4_XO2uroUNLFVRwGie5AEwzccaps"); }

    const items = [
        {n: "Ржавый Меч", p: 3, cost: 450}, {n: "Стальной Клинок", p: 7, cost: 1200},
        {n: "Топор Берсерка", p: 15, cost: 2700}, {n: "Меч Дракона", p: 30, cost: 6000},
        {n: "Молот Молний", p: 50, cost: 10500}
    ];

    items.forEach(i => {
        document.getElementById('shopList').innerHTML += `<div class="card">${i.n} (+${i.p} силы)<br><button class="btn" onclick="buy(${i.cost}, ${i.p})">${i.cost} RICH</button></div>`;
    });

    function buy(c, p) {
        if(state.balance < c) return alert("Не хватает RICH!");
        state.balance -= c; state.power += p; update();
    }

    update();
</script>
</body>
</html>
