<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Battle Bot</title>
    <!-- Подключаем TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #wallet-container {
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            margin: 10px 0;
        }
        #score {
            font-size: 42px;
            color: #00ffcc;
            font-weight: bold;
            margin: 10px 0;
        }
        .energy-box {
            font-size: 16px;
            color: #ffaa00;
            margin-bottom: 20px;
        }
        #click-btn {
            background: radial-gradient(circle, #ff007f, #7f00ff);
            border: none;
            border-radius: 50%;
            width: 170px;
            height: 170px;
            font-size: 22px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
            transition: transform 0.05s;
            outline: none;
        }
        #click-btn:active {
            transform: scale(0.9);
        }
        .shop {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }
        .buy-btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .buy-btn:hover {
            background-color: #00ccaa;
        }
    </style>
</head>
<body>

    <!-- Кнопка подключения TON-кошелька -->
    <div id="wallet-container"></div>

    <h1>⚔️ Битва за Токены</h1>
    <div id="score">0</div>
    
    <div class="energy-box">
        ⚡ Энергия: <span id="energy">1000</span> / 1000
    </div>

    <button id="click-btn" onclick="hitBoss()">ТАП! 🚀</button>

    <div class="shop">
        <h3>🛒 Магазин Экипировки</h3>
        <p>Лазерный меч (+1 урон): 50 монет</p>
        <button class="buy-btn" onclick="buySword()">Купить (50 🪙)</button>
    </div>

    <script>
        // Инициализация TON Connect
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/sdk/main/packages/tonconnectui/samples/tonconnect-manifest.json',
            uiPreferences: { theme: 'DARK' },
            targetButtonRootId: 'wallet-container'
        });

        // Загружаем сохраненные данные (если они есть) или ставим стандартные
        let score = Number(localStorage.getItem("game_score")) || 0;
        let clickPower = Number(localStorage.getItem("game_power")) || 1;
        let energy = Number(localStorage.getItem("game_energy")) || 1000;
        const maxEnergy = 1000;

        // Сразу выводим актуальные цифры при входе
        updateScreen();

        // Функция сохранения данных в память телефона
        function saveData() {
            localStorage.setItem("game_score", score);
            localStorage.setItem("game_power", clickPower);
            localStorage.setItem("game_energy", energy);
        }

        // Функция клика
        function hitBoss() {
            if (energy >= clickPower) {
                score += clickPower;
                energy -= clickPower;
                updateScreen();
                saveData(); // Сохраняем после каждого клика
            }
        }

        // Покупка оружия
        function buySword() {
            if (score >= 50) {
                score -= 50;
                clickPower += 1;
                updateScreen();
                saveData(); // Сохраняем после покупки
                alert("Оружие куплено! Твой урон вырос.");
            } else {
                alert("Не хватает монет!");
            }
        }

        // Обновление цифр на экране
        function updateScreen() {
            document.getElementById("score").innerText = score;
            document.getElementById("energy").innerText = energy;
        }

        // Авто-восстановление энергии каждую секунду + сохранение
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 5;
                if (energy > maxEnergy) energy = maxEnergy;
                document.getElementById("energy").innerText = energy;
                saveData(); // Сохраняем восстановление энергии
            }
        }, 1000);
    </script>

</body>
</html>
