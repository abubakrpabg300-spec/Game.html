<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Игра</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            margin-top: 10px;
        }
        #score {
            font-size: 48px;
            color: #00ffcc;
            margin: 30px 0;
        }
        #click-btn {
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            border: none;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            font-size: 24px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s;
        }
        #click-btn:active {
            transform: scale(0.92);
        }
        .shop {
            margin-top: 40px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
        }
        .buy-btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🚀 Битва с Боссом</h1>
    <div id="score">0</div>
    
    <button id="click-btn" onclick="hitBoss()">УДАР! ⚔️</button>

    <div class="shop">
        <h3>🛒 Магазин Оружия</h3>
        <p>Меч (+1 урон за клик): Цена 50 монет</p>
        <button class="buy-btn" onclick="buySword()">Купить меч</button>
    </div>

    <script>
        let score = 0;
        let clickPower = 1;

        function hitBoss() {
            score += clickPower;
            document.getElementById("score").innerText = score;
        }

        function buySword() {
            if (score >= 50) {
                score -= 50;
                clickPower += 1;
                document.getElementById("score").innerText = score;
                alert("Ты купил новое оружие! Урон увеличен.");
            } else {
                alert("Не хватает монет!");
            }
        }
    </script>

</body>
</html>
