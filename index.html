<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICH Battle Bot</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем TON Connect UI -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #070514, #1b143a, #0f0c29);
            --primary-accent: #00ffcc;
            --secondary-accent: #ff007f;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            background: var(--bg-gradient);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .user-badge {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--primary-accent);
            backdrop-filter: blur(10px);
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 10px 0;
            color: #b8b8f3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #score {
            font-size: 44px;
            color: var(--primary-accent);
            font-weight: 800;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            margin: 5px 0;
        }
        .energy-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffaa00, #ff007f);
            width: 100%;
            transition: width 0.2s;
        }
        .energy-text {
            font-size: 13px;
            color: #ffaa00;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
        }
        .clicker-container {
            margin: 20px 0;
        }
        #click-btn {
            background: radial-gradient(circle, #ff007f 0%, #7f00ff 100%);
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 160px;
            height: 160px;
            font-size: 24px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
            transition: transform 0.05s, box-shadow 0.05s;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        #click-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
        }
        .btn-action {
            background: linear-gradient(135deg, #00ffcc, #00bfff);
            color: #070514;
            border: none;
            padding: 12px 20px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        .btn-action:active {
            opacity: 0.8;
        }
        .ref-box {
            font-size: 12px;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            margin-top: 8px;
            color: #a0a0c0;
        }
        /* Стили для админ-панели */
        .admin-panel {
            border: 2px dashed #ff007f;
            display: none; /* Скрыта по умолчанию для обычных игроков */
        }
    </style>
</head>
<body>

    <!-- Шапка профиля и кошелек -->
    <div class="header">
        <div class="user-badge" id="user-info">ID: Загрузка...</div>
        <div id="wallet-container"></div>
    </div>

    <!-- Основная игровая карточка -->
    <div class="card">
        <h1>💎 Баланс RICH</h1>
        <div id="score">0</div>
        
        <div class="clicker-container">
            <button id="click-btn" onclick="hitBoss()">ТАП! 🚀</button>
        </div>

        <div class="energy-text">
            <span>⚡ Энергия</span>
            <span><span id="energy">1000</span> / 1000</span>
        </div>
        <div class="energy-container">
            <div id="energy-bar"></div>
        </div>
    </div>

    <!-- Магазин -->
    <div class="card">
        <h1>🛒 Магазин Оружия</h1>
        <p style="font-size: 13px; color: #a0a0c0; margin: 5px 0;">Лазерный меч (+1 урон за клик)</p>
        <button class="btn-action" onclick="buySword()">Купить за 50 RICH</button>
    </div>

    <!-- Реферальная система -->
    <div class="card">
        <h1>👥 Рефералы</h1>
        <p style="font-size: 12px; color: #a0a0c0; margin: 5px 0;">Пригласи друга и получи +100 RICH!</p>
        <div class="ref-box" id="ref-link">Генерация ссылки...</div>
        <button class="btn-action" style="background: linear-gradient(135deg, #ff007f, #7f00ff); color: white;" onclick="copyRefLink()">🔗 Поделиться ссылкой</button>
    </div>

    <!-- АДМИН-ПАНЕЛЬ (Видна только тебе по ID) -->
    <div class="card admin-panel" id="admin-card">
        <h1 style="color: #ff007f;">🛠️ Админ-Панель</h1>
        <p style="font-size: 12px; color: #a0a0c0;">Режим Администратора активен</p>
        <button class="btn-action" style="background: linear-gradient(135deg, #ffaa00, #ff5500);" onclick="adminAddRich()">➕ Начислить +1000 RICH</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userId = "guest";
        let botUsername = "ТвойБот_bot"; // Можешь заменить на юзернейм своего бота

        // Твой ID администратора
        const ADMIN_ID = 8684827145; 

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
            document.getElementById("user-info").innerText = "ID: " + userId;

            // Проверка: если зашел ты, показываем админку
            if (Number(userId) === ADMIN_ID) {
                document.getElementById("admin-card").style.display = "block";
            }
        } else {
            document.getElementById("user-info").innerText = "Web Version";
        }

        // Реферальная ссылка
        const refLink = `https://t.me/${botUsername}?start=ref_${userId}`;
        document.getElementById("ref-link").innerText = refLink;

        function copyRefLink() {
            navigator.clipboard.writeText(refLink);
            alert("Реферальная ссылка скопирована!");
        }

        // TON Connect
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/sdk/main/packages/tonconnectui/samples/tonconnect-manifest.json',
            uiPreferences: { theme: 'DARK' },
            targetButtonRootId: 'wallet-container'
        });

        // Игровые данные RICH (сохраняются отдельно для каждого игрока)
        let score = Number(localStorage.getItem(`score_${userId}`)) || 0;
        let clickPower = Number(localStorage.getItem(`power_${userId}`)) || 1;
        let energy = Number(localStorage.getItem(`energy_${userId}`)) || 1000;
        const maxEnergy = 1000;

        updateScreen();

        function saveData() {
            localStorage.setItem(`score_${userId}`, score);
            localStorage.setItem(`power_${userId}`, clickPower);
            localStorage.setItem(`energy_${userId}`, energy);
        }

        function hitBoss() {
            if (energy >= clickPower) {
                score += clickPower;
                energy -= clickPower;
                updateScreen();
                saveData();
            }
        }

        function buySword() {
            if (score >= 50) {
                score -= 50;
                clickPower += 1;
                updateScreen();
                saveData();
                alert("Оружие успешно куплено!");
            } else {
                alert("Не хватает монет RICH!");
            }
        }

        // Кнопка начисления RICH для админа
        function adminAddRich() {
            score += 1000;
            updateScreen();
            saveData();
            alert("Админ-бонус: +1000 RICH начислено!");
        }

        function updateScreen() {
            document.getElementById("score").innerText = score;
            document.getElementById("energy").innerText = energy;
            let percent = (energy / maxEnergy) * 100;
            document.getElementById("energy-bar").style.width = percent + '%';
        }

        // Авто-восстановление энергии
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 5;
                if (energy > maxEnergy) energy = maxEnergy;
                updateScreen();
                saveData();
            }
        }, 1000);
    </script>

</body>
</html>
