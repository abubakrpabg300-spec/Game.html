<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rich Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background: #1a1a2e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a4a;
        }
        .balance { font-size: 20px; font-weight: bold; color: #f5a623; }
        .tap-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
            flex-direction: column;
        }
        .coin {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle at 30% 30%, #f5a623, #d4891b);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
            border: 4px solid #f5c542;
            box-shadow: 0 10px 40px rgba(245, 166, 35, 0.3);
        }
        .coin:active { transform: scale(0.9); }
        .coin-text { margin-top: 20px; color: #aaa; }
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
            padding: 10px 0;
        }
        .menu-item {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            cursor: pointer;
            color: #888;
            font-size: 14px;
            border: none;
            background: none;
        }
        .menu-item.active { color: #f5a623; }
        .page { display: none; padding: 20px; height: 70vh; overflow-y: auto; }
        .page.active { display: block; }
        .profile-item {
            background: #1a1a2e;
            padding: 15px 20px;
            border-radius: 12px;
            margin: 10px 0;
            border: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
        }
        .profile-item .label { color: #888; }
        .profile-item .value { color: #fff; font-weight: bold; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px 0;
        }
        .btn-deposit { background: #2d7d46; color: white; }
        .btn-withdraw { background: #7d2d2d; color: white; }
        .btn:active { transform: scale(0.97); }
        .history { color: #aaa; font-size: 13px; margin-top: 10px; }
        .history-item { padding: 8px 0; border-bottom: 1px solid #1a1a2e; }
        .badge { background: #2a2a4a; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
        .copy-btn {
            background: #2a2a4a;
            border: none;
            color: #f5a623;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="balance">💰 <span id="balanceDisplay">0</span> RICH</div>
    <div>🆔 <span id="userIdDisplay">загрузка</span></div>
</div>

<div id="page-clicker" class="page active">
    <div class="tap-area">
        <div class="coin" id="coin">🪙</div>
        <div class="coin-text">Нажми на монету → +1 RICH</div>
    </div>
</div>

<div id="page-profile" class="page">
    <div class="profile-item">
        <span class="label">🆔 Telegram ID</span>
        <span class="value" id="profileId">загрузка</span>
    </div>
    <div class="profile-item">
        <span class="label">💰 Баланс</span>
        <span class="value" id="profileBalance">0 RICH</span>
    </div>
    <div class="profile-item">
        <span class="label">💳 TON кошелёк</span>
        <span class="value" style="font-size:12px; word-break:break-all;">UQDmNY1TIMIgnALOpAyJ4_XO2uroUNLFVRwGie5AEwzccaps</span>
    </div>
    <button class="btn btn-deposit" id="depositBtn">💰 Пополнить</button>
    <button class="btn btn-withdraw" id="withdrawBtn">💳 Вывести</button>
    <div class="history">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <span>📊 История</span>
            <span class="badge">последние 5</span>
        </div>
        <div id="historyList">
            <div class="history-item">✅ Пополнение: +500 RICH</div>
            <div class="history-item">✅ Пополнение: +1000 RICH</div>
            <div class="history-item">⏳ Вывод: 300 RICH (ожидает)</div>
        </div>
    </div>
</div>

<div class="bottom-menu">
    <button class="menu-item active" data-page="clicker">🪙 Кликер</button>
    <button class="menu-item" data-page="profile">👤 Профиль</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let userId = tg.initDataUnsafe?.user?.id || 'неизвестно';
    let balance = 0;

    document.getElementById('balanceDisplay').textContent = balance;
    document.getElementById('userIdDisplay').textContent = userId;
    document.getElementById('profileId').textContent = userId;
    document.getElementById('profileBalance').textContent = balance + ' RICH';

    document.getElementById('coin').addEventListener('click', function() {
        balance += 1;
        document.getElementById('balanceDisplay').textContent = balance;
        document.getElementById('profileBalance').textContent = balance + ' RICH';
        this.style.transform = 'scale(0.85)';
        setTimeout(() => { this.style.transform = 'scale(1)'; }, 150);
        tg.sendData(JSON.stringify({ action: 'tap', userId: userId, balance: balance }));
    });

    document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + this.dataset.page).classList.add('active');
        });
    });

    document.getElementById('depositBtn').addEventListener('click', function() {
        tg.showPopup({
            title: '💰 Пополнение',
            message: 'Отправь TON на кошелёк:\nUQDmNY1TIMIgnALOpAyJ4_XO2uroUNLFVRwGie5AEwzccaps\n\nВ комментарии укажи свой ID: ' + userId,
            buttons: [{ type: 'ok' }]
        });
    });

    document.getElementById('withdrawBtn').addEventListener('click', function() {
        tg.showPopup({
            title: '💳 Вывод',
            message: 'Введи сумму для вывода (мин. 3000 RICH):\n\nПосле подтверждения укажи TON кошелёк.',
            buttons: [{ type: 'ok' }]
        });
    });

    document.getElementById('profileId').addEventListener('click', function() {
        navigator.clipboard.writeText(userId);
        tg.showPopup({
            title: '✅ Скопировано!',
            message: 'ID скопирован в буфер обмена',
            buttons: [{ type: 'ok' }]
        });
    });

    tg.sendData(JSON.stringify({ action: 'getBalance', userId: userId }));
</script>
</body>
  </html>
